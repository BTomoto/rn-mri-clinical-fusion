[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rn-public-data"
version = "0.1.0"
description = "Public HGG post-treatment tumor versus treatment-change analysis, with original RN feasibility history"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0", "numpy>=1.24", "openpyxl>=3.1"]

[tool.setuptools.packages.find]
where = ["src"]
